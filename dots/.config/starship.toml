# SAO / Cardinal System — starship
# Acentos de tono medio (cian #0097b8, magenta #d61f8f) legibles en tema claro y
# oscuro; el texto principal usa el color por defecto de la terminal.
#
#   ◢ FLOOR ~/proyecto ◇ QUEST main [!+] · LINK TIME 3s
#   ▸
add_newline = false

format = """
[◢](bold fg:#d61f8f) $directory$git_branch$git_state$git_status$cmd_duration
$character"""

[character]
success_symbol = "[▸](bold fg:#0097b8)"
error_symbol = "[▸](bold fg:#d93b3b)"     # rojo como el HP bajo
vimcmd_symbol = "[◂](bold fg:#d61f8f)"

[directory]
style = "bold"
read_only = " 󰌾"
read_only_style = "fg:#d93b3b"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
format = "[FLOOR ](fg:#0097b8)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold"
truncation_length = 20
truncation_symbol = "…"
format = "[◇ QUEST ](fg:#d61f8f)[$branch(:$remote_branch)]($style) "

[git_state]
format = '[\($state( $progress_current/$progress_total)\)](bold fg:#d49a00) '

[git_status]
style = "bold fg:#d49a00"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
format = "[· LINK TIME ](dimmed)[$duration](bold) "

[package]
disabled = true
